[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    # numpy's matrix subclass notice: a PendingDeprecationWarning with no version,
    # no date and no removal plan, unchanged since numpy 1.15 and still present in
    # 2.5. navi uses numpy.matrix deliberately -- `*` must stay matrix
    # multiplication in VAR and VECM -- so this is an opinion we have declined.
    # Matched on its message so any OTHER PendingDeprecationWarning still shows.
    ignore:the matrix subclass is not the recommended way:PendingDeprecationWarning
